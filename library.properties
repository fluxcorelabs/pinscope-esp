name=Pinscope
version=0.2.10
author=Filip Code <hello@pinscope.dev>
maintainer=Filip Code <hello@pinscope.dev>
sentence=Reach your ESP32's web server from anywhere, with live logs, crash reports and OTA updates, in 9.4 KB of RAM.
paragraph=One outbound connection to the Pinscope service gives the device's own web server an HTTPS address and carries its logs, metrics, crash reports and firmware updates. No port forwarding, no TLS library on the device. Needs a Pinscope account (three devices free).
category=Communication
